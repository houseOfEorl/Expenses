<html>

<head>
  <title>Embark</title>

  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://secure.embark.ca/templates/assets/hco_fonts/hco_fonts.css" rel="stylesheet" type="text/css" />
  <link rel="shortcut icon" href="https://secure.embark.ca/favicon.ico">
  <link rel="apple-touch-icon" href="https://secure.embark.ca/icons/favicon-apple.png">
  <link rel="icon" href="https://secure.embark.ca/favicon.ico">
  <style>
    ::-ms-reveal {
      display: none;
    }

    input::-webkit-credentials-auto-fill-button {
      visibility: hidden;
      display: none !important;
      pointer-events: none;
      position: absolute;
      right: 0;
    }

    *,
    *::after,
    *::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      height: 100%;
    }

    body {
      color: #000000;
      font-family: 'Motiva Sans', 'Verdana', sans-serif;
    }

    input,
    button {
      font-family: 'Motiva Sans', 'Verdana', sans-serif;
    }

    .errorAlert {
      background-color: #ffede8;
      border-radius: 0.75rem;
      color: #000000;
      display: none;
      font-size: 0.875rem;
      line-height: 1.25rem;
      margin: 1.5rem 1.5rem .5rem;
      padding: 1rem;
    }

    .errorAlert span {
      color: #FA4F00;
      margin-right: 0.625rem;
    }

    .formContainer {
      position: relative;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 1;
      margin: auto;
    }

    #api>div.heading,
    #api>div.heading>h1[role="heading"] {
      display: none !important;
    }

    .container {
      width: 100%;
      display: flex;
      justify-content: center;
      min-height: 100%;
    }

    .logoContainer {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 4rem 0rem 3rem;
    }

    #subHeader {
      font-family: Motiva Sans;
      font-weight: 400;
      font-style: Regular;
      font-size: 18px;
      line-height: 27px;
      letter-spacing: 0px;
      text-align: center;
      margin-bottom: 2rem;
      padding: 1rem;
      line-height: 1.5rem;
      color: #1C1463;
    }

    .leftContent {
      flex: 1;
      background-color: #DDEBF8;
      display: flex;
    }

    .heroContent {
      width: 100%;
      display: none;
    }

    .heroLoadingSpinner {
      animation: loadingSpinner 1s linear infinite;
      background: linear-gradient(#FFFFFF, #FFFFFF), conic-gradient(from 0.15turn, #FFFFFF, #594FF0);
      background-clip: content-box, border-box;
      background-origin: border-box;
      border: 0.75rem solid transparent;
      border-radius: 50%;
      height: 4rem;
      width: 4rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes loadingSpinner {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .leftLogoContainer {
      margin: 2rem 0 0 2rem;
    }

    .heroPartnerLogo {
      max-height: 1.75rem;
    }

    .verticalLine {
      margin-left: .25rem;
      margin-right: .5rem;
    }

    .leftImageContainer {
      margin-top: 3.125rem;
      margin-bottom: 2rem;
      display: flex;
      width: 100%;
      justify-content: center;
    }

    .leftTextContainer {
      margin-top: 3.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;

      &>* {
        max-width: 24rem;
      }
    }

    .leftListContainer {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .leftHeader {
      font-family: 'Motiva Sans', 'Verdana', sans-serif;
      font-size: 2.8125rem;
      font-weight: 700;
      font-style: normal;
      letter-spacing: -1.35px;
      line-height: 48px;
      word-wrap: break-word;
      margin-bottom: 1.5rem;
      color: #1C1463;
    }

    .leftBodyContainer {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .leftSubheader {
      font-family: 'Motiva Sans', 'Verdana', sans-serif;
      font-style: normal;
      font-size: 1.375rem;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.44px;
      color: #1C1463;
      margin-bottom: .5rem;
    }

    .leftBodyText {
      font-family: 'Motiva Sans', 'Verdana', sans-serif;
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.5rem;
      margin: 0;
      color: #1C1463;
      word-wrap: break-word;

      &>* {
        display: inline;
      }
    }

    a.leftBodyLinkContextual {
      font-size: 18px;
      font-style: normal;
      font-weight: 700;
      line-height: 24px;
      white-space: nowrap;
    }

    .leftDesignHero {
      border-radius: 1.25rem;
      max-width: 24rem;
    }

    .rightContent {
      flex: 1;
      display: none;
      position: relative;
      background-color: #ffffff;
      padding: 0;

      .formContainer {
        max-width: 27rem;
        height: 100%;
      }
    }

    #companyLogo {
      display: none;
    }

    .backgroundImageLeft {
      position: fixed;
      left: 0;
      top: 38rem;
    }

    .backgroundImageRight {
      position: fixed;
      right: 0;
      top: 8.875rem;
    }

    .content {
      display: flex;
      flex-direction: column;
    }

    #companyLogo {
      text-align: center;
    }

    #headline {
      font-family: Motiva Sans;
      font-weight: 800;
      font-style: ExtraBold;
      font-size: 28px;
      line-height: 36px;
      letter-spacing: -2%;
      text-align: center;
      color: #1C1463;
    }

    h2,
    label,
    .divider,
    .error.itemLevel,
    .error.pageLevel {
      display: none !important;
    }

    a {
      color: #594FF0;
      border-bottom: 1px solid #594FF0;
      font-weight: 900;
      letter-spacing: 0.005em;
      line-height: 1.5rem;
      outline: none;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      color: #3A31A9;
      border-bottom: 1px dashed #3A31A9;
    }

    a:visited {
      color: #5954A8;
      border-bottom: 1px solid #5954A8;
    }

    #api,
    #localAccountForm,
    .entry {
      height: 100%;
    }

    .entry {
      display: flex;
      flex-direction: column;
    }

    .entry-item {
      margin-bottom: 1rem;
      position: relative;
      height: 3.75rem;
    }

    .entry-item>input {
      background-color: #FFFFFF;
      border: 1px solid rgba(28, 20, 99, 0.25);
      border-radius: 0.5rem;
      color: #1C1463;
      -webkit-text-fill-color: #1C1463;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      padding: 1.2rem 3.25rem 1.2rem 1rem;
      transition: 0.1s ease-out;
      width: 100%;
    }

    .entry-item>input:-webkit-autofill,
    .entry-item>input:-webkit-autofill:hover,
    .entry-item>input:-webkit-autofill:focus,
    .entry-item>input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 62.5rem #FFFFFF inset;
      background-color: #FFFFFF !important;
      background-clip: content-box !important;
      top: calc(100% - 1.8rem);
    }

    .entry-item>span {
      position: absolute;
      top: calc(100% - 1.8rem);
      left: 0;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.5rem;
      transform: translateY(-50%);
      background-color: white;
      color: #594FF0;
      padding: 0 0.5rem;
      margin: 0 0.5rem;
      transition: 0.1s ease-out;
      transform-origin: left top;
      pointer-events: none;
      z-index: 1;
    }

    .entry-item>input:focus,
    .entry-item>input:hover {
      border: 2px solid #594FF0;
      margin: -1px;
      padding-left: 1rem;
    }

    .entry-item>input:focus+span,
    .entry-item>input:hover+span,
    .entry-item>input:not(:placeholder-shown)+span {
      font-size: 0.875rem;
      letter-spacing: 0.005em;
      top: calc(100% - 3.75rem);
      transform: translateY(-50%) !important;
    }

    .entry-item>input:not(:focus)::placeholder,
    .entry-item>input:not(:hover)::placeholder {
      opacity: 0;
    }

    .entry-item>#password-field-label:not(:focus),
    .entry-item>#password-field-label:not(:hover) {
      transform: translateY(-50%);
    }

    #emailClear,
    #passwordToggle {
      cursor: pointer;
      pointer-events: all;
      position: absolute;
      vertical-align: auto;
      top: calc(100% - 3rem);
      left: calc(100% - 2.85rem);
      font-size: 1.5rem;
      font-weight: 400;
      color: #594FF0;
      background-color: transparent;
      user-select: none;
    }

    #emailLabel--error,
    #passwordLabel--error {
      color: #FA4F00;
    }

    .inputError {
      color: #FA4F00;
      display: none;
      font-size: 0.875rem;
      font-weight: 700;
      line-height: 1.25rem;
      margin: 0;
    }

    .inputError--visible {
      display: block;
      margin: -0.5rem 0.25rem 1.5rem;
    }

    .buttons {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 1.125rem;
      font-weight: 900;
      height: 3.5rem;
      letter-spacing: normal;
      line-height: 1.25rem;
      max-width: 15rem;
      outline: none;
      text-transform: none;
      width: 100%;
    }

    #next {
      background: #594FF0;
      color: #FFFFFF;
      margin: 1.5rem 0 0.5rem;
    }

    #next:hover {
      background: linear-gradient(0, rgba(78, 67, 229, 0.5), rgba(78, 67, 229, 0.5)), #1C1463;
    }

    #next:focus {
      background: linear-gradient(0, rgba(78, 67, 229, 0.3), rgba(78, 67, 229, 0.3)), #1C1463;
      border: 3px solid #C3C0FF;
    }

    #next:active {
      background: #685FFF;
      outline: none;
    }

    .iconButton {
      align-items: center;
      display: flex;
      height: 2.25rem;
      justify-content: center;
      width: 2.25rem;
    }

    .iconButton:active {
      outline: 3px solid #C3C0FF;
      outline-offset: 3px;
    }

    #cancel {
      margin-bottom: 3rem;
    }

    #cancel,
    .iconButton {
      background: transparent;
      color: #594FF0;
    }

    #cancel:hover,
    #cancel:focus,
    .iconButton:hover,
    .iconButton:focus {
      border: 2px solid #594FF0;
    }

    #cancel:active {
      background: #C3C0FF;
      color: #1C1463;
      outline: none;
    }

    .border {
      border: 0;
      border-top: 1px solid;
      border-color: rgba(28, 20, 99, 0.25);
      margin-bottom: 1.25rem;
      margin-top: auto;
      width: 100%;
      align-self: flex-end;
    }

    #forgotPassword {
      margin-bottom: 1rem;
      width: fit-content;
    }

    .create p {
      font-weight: 700;
    }

    #forgotPassword,
    .create,
    .signup {
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    .footer {
      align-items: center;
      display: flex;
      flex-direction: column;
      padding: 9.125rem 1.5rem 3rem;
    }

    .footer__links,
    .footer__copyright {
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1rem;
    }

    .footer__links {
      align-items: center;
      color: #594FF0;
      display: flex;
      margin-bottom: 0.25rem;
    }

    .footer__links a {
      border-bottom: none;
    }

    .footer__links__divider {
      margin: 0 0.5rem;
    }

    .footer__copyright {
      color: #8E9192;
    }

    .actionsBanner {
      display: block;
      padding: 0 1rem;
      position: relative;
      margin: 0 0 7rem 0;
    }

    .actionsBannerContainer {
      padding: 0 1rem;
      width: 100%;
      height: 80px;
      left: 0px;
      top: 0px;
      position: absolute;
      background: white;
      box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.25);
      border-radius: 9px;
      border: 1px #D8D8D8 solid;
    }

    .actionsBannerStripe {
      width: 17px;
      height: 78px;
      left: 0.5px;
      top: 1px;
      position: absolute;
      background: #DBFF45;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .actionsBannerTitles {
      color: #1C1463;
      font-size: 13px;
      font-family: Motiva Sans;
      font-weight: 500;
      word-wrap: break-word;
    }

    @media screen and (max-width: 64em) {

      body {
        padding: 0;
      }

      .container {
        flex-direction: column;
        height: auto;
      }

      .content {
        max-width: unset;
      }

      .leftContent {
        flex: none;
        background-color: #FFFFFF;
        display: none;

        &.contextual {
          display: block;

          & .leftTextContainer {
            margin: 1.5rem 0 1.5rem 0 !important;
            background-color: #EEEDFD;
            padding: 3rem;
          }
        }
      }

      .leftHeader {
        font-size: 36px;
        font-style: normal;
        font-weight: 700;
        line-height: 40px;
        /* 111.111% */
        letter-spacing: -1.08px;
      }

      .leftBodyText {
        font-size: 14px;
        font-style: normal;
        font-weight: 400;
        line-height: 20px;
      }

      a.leftBodyLinkContextual {
        font-size: 14px;
        font-style: normal;
        font-weight: 700;
        line-height: 20px;
        white-space: nowrap;
      }

      .leftLogoContainer {
        margin-left: .78125rem;
      }

      .leftImageContainer {
        display: none;
      }

      .rightContent {
        margin: 0 0.75rem;

        #companyLogo {
          display: flex;
          margin: 1.5rem 0.75rem;
        }

        &.contextual {
          #companyLogo {
            display: none;
          }

          .formContainer {
            margin-top: 0;
          }
        }

        .formContainer {
          margin-top: 9.75rem;
          width: 100%;
        }
      }
    }

    @media screen and (max-width: 50em) {
      body {
        background-color: #FFFFFF;
      }

      #errorBanner {
        position: static;
      }

      .rightContent {
        padding: 0;
        background-color: #ffffff;
      }

      #headline {
        font-size: 1.5rem;
        line-height: 2rem;
      }

      .backgroundImageRight,
      .backgroundImageLeft {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="focusFix" tabindex="0" autofocus="autofocus"></div>
  <div class="container">
    <div id="heroLoadingSpinner" class="heroLoadingSpinner" role="progressbar"></div>
    <div class="leftContent">
      <div class="heroContent">
        <div class="leftLogoContainer">
          <img data-tenant-branding-logo="true"
            src="https://secure.embark.ca/templates/assets/logo/embark_violet.svg" alt="Embark">
        </div>
        <div class="leftTextContainer">
          <div class="leftHeader">A trusted leader in education savings</div>
          <div class="leftListContainer">
            <div class="leftBodyContainer">
              <div class="leftSubheader">60</div>
              <div class="leftBodyText">
                years of specialized experience in education saving and planning
              </div>
            </div>
            <div class="leftBodyContainer">
              <div class="leftSubheader">60,000+</div>
              <div class="leftBodyText">
                students supported every year
              </div>
            </div>
            <div class="leftBodyContainer">
              <div class="leftSubheader">$6.4 billion</div>
              <div class="leftBodyText">
                Assets Under Management (AUM)
              </div>
            </div>
          </div>
        </div>
        <div class="leftImageContainer">
          <img src="https://secure.embark.ca/templates/assets/images/students.jpg"
            alt="Students walking on campus" class="leftDesignHero">
        </div>
      </div>
    </div>
    <div class="rightContent">
      <div id="companyLogo">
        <img
          data-tenant-branding-logo="true"
          src="https://secure.embark.ca/templates/assets/logo/embark_violet.svg"
          alt="Embark"
        >
      </div>
      <div class="formContainer">
        <div class="content">
          <div class="mobileLoadingSpinner" role="progressbar"></div>
          <div id="errorBanner" class="errorAlert">
            <span class="material-icons">error</span>
            <div id="serverErrorMessage"></div>
          </div>
          <h1 id="headline">
            Sign up or log in
          </h1>
          <h1 id="subHeader">
            Enter your email to get started.
          </h1>
          <div id="api" data-name="Unified"></div>
        </div>
      </div>
    </div>

    <script>

      const emailInput = document.getElementById('email');
      const nextButton = document.getElementById('next');

      function goBack() {
        history.back();
      }

      // Remove email input autofocus
      emailInput.removeAttribute('autofocus');
      emailInput.blur();
      const focusFix = document.getElementById('focusFix');
      focusFix.focus();
      setTimeout(() => {
        focusFix.remove();
      }, 500);

      // Insert email input error message
      const emailError = document.createElement('div');
      emailError.setAttribute('id', 'emailError');

      const emailInputContainer = document.getElementsByClassName('entry-item')[0];
      emailInputContainer.insertAdjacentElement('afterend', emailError);


      // Insert email clear button
      const emailClear = document.createElement('button');
      emailClear.setAttribute('class', 'iconButton');
      emailClear.setAttribute('id', 'emailClear');
      emailClear.innerHTML = '<span class="material-icons">clear</span>'
      emailClear.addEventListener('click', function () {
        emailInput.value = '';
      });
      emailInput.insertAdjacentElement('afterend', emailClear);


      // Remove placeholders
      emailInput.setAttribute('placeholder', " ");

      // Insert custom email label
      const emailLabel = document.createElement('span');
      emailLabel.setAttribute('id', 'emailLabel');
      emailLabel.innerHTML = 'Email';
      emailInput.insertAdjacentElement('afterend', emailLabel);


      // Handle server error message
      const defaultServerError = document.getElementsByClassName('error pageLevel')[0];
      const errorBanner = document.getElementById('errorBanner');
      const serverErrorMessage = document.getElementById('serverErrorMessage');

      const serverErrorObserver = new MutationObserver(function (e) {
        if (e[0].target.getAttribute('aria-hidden') === "false") {
          errorBanner.style.display = 'flex';
          serverErrorMessage.innerHTML = defaultServerError.innerHTML;
        }
        else {
          errorBanner.style.display = 'none';
          serverErrorMessage.innerHTML = '';
        }
      });
      serverErrorObserver.observe(defaultServerError, { attributes: true });

      // Handle email input error state
      const defaultEmailError = document.getElementsByClassName('error itemLevel')[0];

      const emailErrorObserver = new MutationObserver(function (e) {
        if (e[0].target.getAttribute('aria-hidden') === 'false') {
          emailInput.style.border = '2px solid #FA4F00';
          emailInput.style.margin = '-1px';
          emailLabel.setAttribute('id', 'emailLabel--error');
          emailError.innerHTML = defaultEmailError.innerHTML;
          emailError.setAttribute('class', 'inputError inputError--visible');
        } else {
          emailInput.style.borderColor = '';
          emailInput.style.boxShadow = '';
          emailLabel.setAttribute('id', 'emailLabel');
          emailError.innerHTML = '';
          emailError.setAttribute('class', 'inputError');
        }
      });
      emailErrorObserver.observe(defaultEmailError, { attributes: true });

      emailInput.addEventListener('input', function () {
        if (defaultEmailError.getAttribute('aria-hidden') === 'false') {
          defaultEmailError.setAttribute('aria-hidden', 'true');
        }
      });

      // Handle Enter key press on email input
      emailInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          nextButton.click();
        }
      });

      //Hide signup link
      const signupLink = document.getElementsByClassName('create')[0];
      signupLink.style.display = 'none'

      const formButtons = [
        {
          id: 'next',
          eventHub: {
            codes: { 'click': 'EMTR-02' }
          }
        }
      ]

      const queryParameters = {}

      new URLSearchParams(window.location.search).forEach((value, key) => {
        queryParameters[key] = value
        sessionStorage.setItem(key, value);
      })

      // Fallback to sessionStorage if query parameter is not present
      function getParameter(key) {
        return queryParameters[key] || sessionStorage.getItem(key) || '';
      }

      const trackedData = {
        utm: {
          utm_source: getParameter('utm_source'),
          utm_medium: getParameter('utm_medium'),
          utm_campaign: getParameter('utm_campaign'),
          utm_content: getParameter('utm_content'),
        },
        mContent: getParameter('mcontent')
      }

      function getCookie(name) {
        let cookieArr = document.cookie.split(";");

        for (let i = 0; i < cookieArr.length; i++) {
          let cookiePair = cookieArr[i].split("=");
          if (name == cookiePair[0].trim()) {
            return decodeURIComponent(cookiePair[1]);
          }
        }
        return null;
      }

      async function postEvent(body) {
        const response = await fetch('https://devsecure.embarkcorp.ca/resp/api/v1.0/event', {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Ga-Customerid": `${getCookie("_ga")}`
          },
          body
        });
        return response.json();  // No error handling if fetch fails
      }

      function sendEventHubEvent(eventCode) {
        const sessionId = getParameter('sessionId');
        if (!eventCode) return;
        
        // Get current email value when sending event
        const dataWithEmail = {
          ...trackedData,
          email: emailInput?.value || ''
        };
        
        const body = JSON.stringify({ eventCode, sessionId, data: dataWithEmail });
        return postEvent(body);
      }

      function onReady() {
        sendEventHubEvent('EMTR-01');
      }

      if (document.readyState !== 'loading') {
        onReady();
      } else {
        document.addEventListener('DOMContentLoaded', onReady)
      }

      formButtons.forEach((formButton) => {
        const { id, eventHub } = formButton || {}
        const buttonElement = document.getElementById(id)
        if (!buttonElement || !eventHub?.codes) return;  // Add null check
        
        const eventTypes = Object.keys(eventHub.codes)  // Get keys from codes
        eventTypes.forEach((eventType) => {
          buttonElement.addEventListener(eventType, () => sendEventHubEvent(eventHub.codes[eventType]));
        })
      })
    </script>
