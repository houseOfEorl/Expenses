<html>
<head>
  <title>Embark</title>

  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://devsecure.embarkcorp.ca/templates/assets/hco_fonts/hco_fonts.css" rel="stylesheet" type="text/css" />
  <link rel="shortcut icon" href="https://devsecure.embarkcorp.ca/favicon.ico">
  <link rel="apple-touch-icon" href="https://devsecure.embarkcorp.ca/icons/favicon-apple.png">
  <link rel="icon" href="https://devsecure.embarkcorp.ca/favicon.ico">  
  <link href="http://localhost:8080/templates/assets/styles/signup.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div id="focusFix" tabindex="0" autofocus="autofocus"></div>
  <div class="container">
    <div class="leftContent">
      <div class="heroLoadingSpinner" role="progressbar"></div>
      <div class="heroContent">
        <div class="leftLogoContainer">
          <img data-tenant-branding-logo="true" src="https://devsecure.embarkcorp.ca/templates/assets/logo/embark_violet.svg"alt="Embark">
        </div>
        <div class="leftTextContainer">
          <div class="leftHeader">
            Your own Embark login
          </div>
          <div class="leftListContainer">
            <div class="leftBodyContainer">
              <div class="leftBodyText">
                Access your tax slips, school tools, and money basics, all in one place.
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="leftImageContainer">
        <img src="https://devsecure.embarkcorp.ca/templates/assets/images/students.jpg" alt="Students walking on campus" class="leftDesignHero">
      </div>
    </div>
    <div class="rightContent">
      <div class="formContainer">
        <div class="content">
          <div class="rightLogoContainer">
            <img data-tenant-branding-logo="true" src="https://devsecure.embarkcorp.ca/templates/assets/logo/embark_violet.svg"
              alt="Embark">
          </div>
          <div class="mobileLoadingSpinner" role="progressbar"></div>
          <div id="serverError" class="errorAlert">
            <span class="material-icons">error</span>
            <div id="serverErrorMessage"></div>
          </div>
          <h1 id="headline">
            Sign up for a student account
          </h1>
          <div id="api" data-name="SelfAsserted"></div>
          <div id="phoneBannerHolder" class="phoneBannerHolder">
            <div id="phoneBanner" class="phoneBannerContainer">
              <img src="https://devsecure.embarkcorp.ca/templates/assets/images/polygon.svg" />
              <div class="phoneBannerConent">
                <div>
                  <img src="https://devsecure.embarkcorp.ca/templates/assets/images/phone.svg" />
                </div>
                <div>
                  <span class="phoneBannerText1">Is this the right mobile number?</span>
                  <span class="phoneBannerText2">
                    We’ll send a text message with a code to this number for security and login verification.
                  </span>
                </div>
                <div>
                  <button class="iconCloseButton" id="phoneBannerCloseButton"><img
                      src="https://devsecure.embarkcorp.ca/templates/assets/images/close.svg" /></button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="termsAndConditions"></div>
      </div>
    </div>
  </div>
  <script src="http://localhost:8080/templates/assets/scripts/signupStudent.js"></script>
  <script src="http://localhost:8080/templates/assets/scripts/authPageHero.js" id="page-content-script" data-api-url="https://devsecure.embarkcorp.ca"></script>
</body>
</html>
